pipeline:
  name: P1

stages:
  - build
  - test
  - doc
  - deploy

compile:
  name: compile
  stage: build
  needs: [static_analysis]
  script:
      - echo "Compiling the source code..."
  artifacts:
      paths:
        - target/

static_analysis:
  name: static_analysis
  stage: build
  script:
    - echo "Running static analysis..."

unit_test:
  name: unit_test
  stage: test
  needs: [ compile ]
  script:
    - echo "Running tests..."



generate_docs:
  name: generate docs
  stage: doc
  needs: [unit_test]
  script:
    - echo "Generating documentation..."

publish:
  name: publish
  stage: deploy
  needs: [generate_docs]
  script:
    - echo "Publishing artifacts..."


default:
  before_script:
    - echo "Starting job..."
  after_script:
    - echo "Job finished."