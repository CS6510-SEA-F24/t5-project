[tool.poetry]
name = "t5-grp"
version = "0.1.0"
description = "A tool to generate and visualize pipeline diagrams"
authors = ["Yoyo <wu.yuanyu@northeastern.edu>"]
license = "MIT"
readme = "README.md"

packages = [
    { include = "t5_grp", from = "src/main" }
]


[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"
pyyaml = "^6.0.2"
graphviz = "^0.20.3"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
