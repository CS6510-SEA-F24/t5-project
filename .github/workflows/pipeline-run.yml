name: Pipeline Run
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - closed
  push:
    branches:
      - main
jobs:
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install poetry
          poetry --version

      - name: Update Lock File
        run: poetry lock

      - name: Install dependencies
        run: |
          poetry install

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
            chrome-version: 131
            install-chromedriver: true
            install-dependencies: true

      - name: Verify ChromeDriver Installation
        run: |
            echo "ChromeDriver installed at ${{ steps.setup-chrome.outputs.chromedriver-path }}"
            ${{ steps.setup-chrome.outputs.chromedriver-path }} --version

      - name: Get Chrome Path
        run: |
          echo "Google Chrome installed at ${{ steps.setup-chrome.outputs.chrome-path }}"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version

      - name: Run Tests and Coverage
        env:
            PYTHONPATH: ${{ github.workspace }}/src
            CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
            GITHUB_WORKSPACE: ${{ github.workspace }}
            LOCAL_HTML_PATH: ${{ github.workspace }}/src/main/output.html
        run: |
          mkdir -p reports/tests
          mkdir -p htmlcov
          # Ensure src/main directory exists
          mkdir -p ${{ github.workspace }}/src/main
          poetry run pytest src/tests/parser/test_yaml_parser.py src/tests/test_main.py
          poetry run pytest src/tests/test_page.py
          poetry run pytest --ignore=src/tests/parser/test_yaml_parser.py --ignore=src/tests/test_main.py --ignore=src/tests/test_page.py

      - name: List generated files for debug
        run: |
          ls -R reports

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: reports/tests/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/