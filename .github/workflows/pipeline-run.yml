name: Pipeline Run

on:
  # Trigger on various pull request events
  pull_request:
    types:
      - opened # Trigger on new pull request
      - ready_for_review # Trigger when PR is ready for review
      - synchronize    # Trigger when new commits are pushed to the PR
      - closed  # Trigger when a PR is merged (closed with merged status)
  push:
    branches:
      - main

# Define the jobs to be run in the workflow
jobs:
  pr_pipeline:
    # Run the job if the PR is opened, or synchronized
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install

      - name: Run Tests and Coverage
        run:
          mkdir -p reports/tests
          poetry run pytest --cov=src/ --cov-report=xml --cov-report=html --junitxml=reports/tests/junit.xml --cov-fail-under=70

      - name: Run Lint (Flake8)
        run: poetry run flake8 src/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: reports/tests/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  main_pipeline:
    # Run this job if the PR is merged
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install

      - name: Run Tests and Coverage
        run: |
          mkdir -p reports/tests
          poetry run pytest --cov=src/ --cov-report=xml --cov-report=html --junitxml=reports/tests/junit.xml --cov-fail-under=70

      - name: Run Lint (Flake8)
        run: poetry run flake8 src/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: reports/tests/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/